<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuzzleGlot - Official Site</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #0f172a;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        p {
            color: #64748b;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0284c7;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .links {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: #2563eb;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .links a:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Official App Website</span>
        <h1>PuzzleGlot</h1>
        <p>Aprenda idiomas resolvendo puzzles desafiadores e dinâmicos.</p>
        <div class="links">
            <a href="app-ads.txt">app-ads.txt</a>
        </div>
    </div>
</body>
</html>
