<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a1a3a"/>
      <stop offset="60%" stop-color="#050c1e"/>
      <stop offset="100%" stop-color="#020612"/>
    </radialGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="blueGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0051ff"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0066ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neonFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4" filter="url(#subtleGlow)"/>

  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#blueGlowGrad)" stroke-width="3" stroke-dasharray="14 10" opacity="0.45"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#cyanNeon)" stroke-width="2" opacity="0.6" filter="url(#subtleGlow)"/>

  <g fill="#00d4ff" opacity="0.18">
    <circle cx="110" cy="110" r="3"/><circle cx="130" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="110" cy="130" r="3"/><circle cx="130" cy="130" r="3"/><circle cx="110" cy="150" r="3"/>
    <circle cx="402" cy="362" r="3"/><circle cx="382" cy="382" r="3"/><circle cx="402" cy="382" r="3"/>
    <circle cx="362" cy="402" r="3"/><circle cx="382" cy="402" r="3"/><circle cx="402" cy="402" r="3"/>
  </g>

  <g filter="url(#neonFilter)">
    <path d="M 148 152 L 194 152 L 194 230 L 248 230 L 248 152 L 294 152 L 294 200 L 248 200 L 248 266 L 194 266 L 194 360 L 148 360 Z" fill="url(#cyanNeon)"/>
    <path d="M 276 210 C 276 170, 310 152, 350 152 C 388 152, 416 172, 416 208 L 374 208 C 374 190, 362 182, 348 182 C 334 182, 320 190, 320 206 C 320 236, 420 234, 420 298 C 420 338, 386 360, 344 360 C 300 360, 268 338, 268 296 L 312 296 C 312 318, 326 328, 344 328 C 362 328, 376 318, 376 300 C 376 268, 276 270, 276 210 Z" fill="#ffffff"/>
  </g>

  <path d="M 86 240 L 68 256 L 86 272" fill="none" stroke="url(#cyanNeon)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)"/>
  <path d="M 426 240 L 444 256 L 426 272" fill="none" stroke="url(#cyanNeon)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)"/>

  <circle cx="256" cy="248" r="6" fill="#00d4ff" filter="url(#neonFilter)"/>
</svg>
